            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar Component (Step 2 of 3) -->
<header class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-2xl docked full-width top-0 sticky z-50 shadow-[0_8px_24px_rgba(10,22,40,0.04)] h-16 flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-[#0A1628] dark:text-slate-50" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-semibold text-lg tracking-tight text-[#0A1628] dark:text-slate-50">Nouveau transfert</h1>
</div>
<div class="text-[#FD761A] font-bold font-['Manrope'] text-sm">Step 2 of 3</div>
</header>
<main class="flex-grow max-w-lg mx-auto w-full px-6 py-8 space-y-8 pb-32">
<!-- Route Section: Asymmetric Editorial Layout -->
<section class="flex items-center justify-between bg-surface-container-lowest p-6 rounded-xl">
<div class="flex flex-col items-center gap-2 flex-1">
<div class="w-12 h-12 rounded-full overflow-hidden shadow-sm">

</div>
<span class="text-on-surface font-bold text-sm tracking-widest uppercase">France</span>
</div>
<div class="flex flex-col items-center px-4">
<span class="material-symbols-outlined text-secondary-container text-3xl" data-icon="trending_flat">trending_flat</span>
</div>
<div class="flex flex-col items-center gap-2 flex-1">
<div class="w-12 h-12 rounded-full overflow-hidden shadow-sm border-2 border-surface-container">
<img alt="BJ" class="w-full h-full object-cover" data-alt="close-up of the Benin national flag showing a green vertical band and yellow and red horizontal bands" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCr8VP62CihvtR1pR5GVNtKJUB0sY8KXT2r5-rrmlfqGu81X5Vz1zrJIdGW-_6NMsFQR1oLrPJmYFvkMEt23UpYtihLJL6bkwO5fcUg5hmYry5AwLGO9nH0nS6aPfIVYPwBrq5no_JjU2seVJx9P8kywzUUShLyqTAm1Uap95bwx4DLoeBCd5RJSkOZEhRRBERUiqdUhbJWNMFIcRAfuEW9uVTVQJSmjqWv9QO2sLuY5RGWblYNsU17Zx3dr1RXd7oKYB8gj_oE42O"/>
</div>
<span class="text-on-surface font-bold text-sm tracking-widest uppercase">Benin</span>
</div>
</section>
<!-- Amount Card -->
<div class="space-y-4">
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_8px_24px_rgba(10,22,40,0.04)] relative">
<!-- Send Section -->
<div class="space-y-1">
<label class="text-[10px] font-bold text-on-primary-container tracking-widest uppercase">VOUS ENVOYEZ</label>
<div class="flex items-center justify-between">
<input class="bg-transparent border-none p-0 text-4xl font-bold font-headline focus:ring-0 text-on-primary-fixed w-full" type="text" value="200"/>
<button class="flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full hover:bg-surface-container-highest transition-colors">
<span class="font-bold text-sm">USD</span>
<span class="material-symbols-outlined text-sm" data-icon="expand_more">expand_more</span>
</button>
</div>
</div>
<!-- Divider / Conversion Visual -->
<div class="relative py-6">
<div class="absolute inset-y-0 left-4 w-0.5 bg-surface-container-high"></div>
<div class="relative z-10 ml-0.5 -mt-3">
<div class="w-7 h-7 rounded-full bg-surface-container-lowest border-2 border-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-xs text-on-surface-variant" data-icon="sync">sync</span>
</div>
</div>
</div>
<!-- Receive Section -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="text-[10px] font-bold text-on-primary-container tracking-widest uppercase">ILS REÇOIVENT</label>
<button class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-secondary font-bold text-[10px] tracking-wide uppercase">
                            Saisir en XOF
                        </button>
</div>
<div class="flex items-center justify-between">
<div class="text-4xl font-bold font-headline text-on-primary-fixed">118 400</div>
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-2 rounded-full">
<span class="font-bold text-sm text-on-surface">XOF</span>
</div>
</div>
</div>
</div>
<!-- Fee Line -->
<div class="flex items-center gap-3 px-2 py-1">
<div class="bg-emerald-100 dark:bg-emerald-950/30 p-1.5 rounded-full">
<span class="material-symbols-outlined text-emerald-600 text-base" data-icon="verified">verified</span>
</div>
<p class="text-sm font-medium text-on-surface-variant">
                    Frais réseau : <span class="text-emerald-600 font-bold">0,8 %</span> · 1,60 USD seulement
                </p>
</div>
</div>
<!-- Recipient Section -->
<div class="space-y-4">
<h2 class="text-sm font-bold text-on-primary-container tracking-widest uppercase px-1">Coordonnées du bénéficiaire</h2>
<div class="space-y-4">
<div class="bg-surface-container-highest/50 rounded-xl p-4 flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="smartphone">smartphone</span>
<input class="bg-transparent border-none p-0 w-full focus:ring-0 text-lg font-medium placeholder:text-outline-variant" placeholder="+229 96 XX XX XX" type="text"/>
</div>
<div class="flex gap-3">
<button class="flex-1 flex items-center justify-center gap-2 bg-secondary-container text-white rounded-full py-4 font-bold shadow-md active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                        MTN MoMo
                    </button>
<button class="flex-1 flex items-center justify-center gap-2 bg-white text-on-surface rounded-full py-4 font-bold border border-surface-container-high hover:bg-surface-container-low transition-colors active:scale-95">
                        Moov Money
                    </button>
</div>
</div>
</div>
<!-- Blockchain Badge -->
<div class="flex justify-center pt-4">
<div class="inline-flex items-center gap-2 bg-primary-container text-white px-5 py-2.5 rounded-full shadow-lg">
<span class="material-symbols-outlined text-sm" data-icon="hub">hub</span>
<span class="text-[11px] font-bold tracking-wider uppercase">Vérifié sur blockchain · Confirmation en ~30 sec</span>
</div>
</div>
</main>
<!-- Bottom Action Bar (Non-standard Shell Content) -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl z-40">
<div class="max-w-lg mx-auto space-y-4">
<button class="w-full bg-[#FD761A] text-white rounded-full py-5 text-lg font-extrabold flex items-center justify-center gap-3 shadow-[0_12px_32px_rgba(253,118,26,0.25)] hover:bg-[#9D4300] active:scale-[0.98] transition-all">
                Confirmer et envoyer
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center text-[10px] text-on-primary-container font-medium tracking-tight">
                Aucune banque n'intervient · Fonds sécurisés par smart contract
            </p>
</div>
</div>
<!-- Hidden BottomNavBar logic for mobile adherence to JSON spec if this was a top-level screen -->
<!-- However, since it's a transactional "Step 2" screen, the "Destination Rule" mandates suppression of global navigation -->
</body></html>
